<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta property="og:title" content="¡Cumple 15 de Joaco y Benja! ⚽">
<meta property="og:description" content="Viernes 13/11 · 17 a 19 hs · Club Altos Bella Vista. ¡Confirmá tu asistencia!">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cumple 15 · Joaco y Benja</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--rojo:#E30613;--rojo-osc:#B0000E;--negro:#111;--gris:#6B6B6B;--borde:#E5E5E5}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',system-ui,sans-serif;background:#ECECEC;color:var(--negro);
    min-height:100vh;display:flex;justify-content:center;padding:18px 12px 40px}
  .card{width:100%;max-width:420px;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.18)}
  .hero{position:relative;padding:32px 20px 28px;text-align:center;overflow:hidden}
  .banda{position:absolute;left:-30%;top:50%;width:160%;height:110px;background:var(--rojo);transform:translateY(-50%) rotate(-24deg)}
  .hero>*:not(.banda){position:relative;z-index:1}
  .chip{display:inline-block;background:var(--negro);color:#fff;font-weight:800;font-size:11px;letter-spacing:2px;padding:8px 14px;border-radius:999px;text-transform:uppercase}
  .quince{font-family:'Anton',sans-serif;font-size:120px;line-height:.9;margin:12px 0 2px;color:#fff;-webkit-text-stroke:3px var(--negro);text-shadow:6px 6px 0 var(--negro)}
  .nombres{font-family:'Anton',sans-serif;font-size:clamp(32px,10vw,42px);white-space:nowrap;line-height:1;background:#fff;display:inline-block;
    padding:6px 16px;border:3px solid var(--negro);border-radius:10px;box-shadow:5px 5px 0 var(--negro)}
  .nombres span{color:var(--rojo)}
  .cuando{margin-top:18px;font-weight:800;font-size:16px;background:#fff;display:inline-block;padding:8px 14px;border-radius:10px;border:2px solid var(--negro)}
  .body{padding:0 18px 22px}
  .bloque{border:2px solid var(--negro);border-radius:18px;padding:18px;margin-top:16px}
  .tit{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .tit::before{content:"";width:10px;height:10px;background:var(--rojo);border-radius:50%}
  .lugar{font-weight:800;font-size:17px}
  .dir{color:var(--gris);font-size:14px;margin:4px 0 14px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;cursor:pointer;font-family:inherit;
    font-weight:800;font-size:16px;padding:15px;border-radius:12px;text-decoration:none}
  .btn:active{transform:scale(.98)}
  .rojo{background:var(--rojo);color:#fff;box-shadow:0 4px 0 var(--rojo-osc)}
  .borde{background:#fff;color:var(--negro);border:2px solid var(--negro)}
  .fila{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:12px}
  input{width:100%;font-family:inherit;font-size:16px;padding:14px;border:2px solid var(--borde);border-radius:12px;outline:none}
  input:focus{border-color:var(--rojo)}
  .err{color:var(--rojo);font-size:13px;font-weight:700;margin-top:8px;min-height:1em}
  .pie{text-align:center;font-size:11px;color:var(--gris);margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <section class="hero">
    <div class="banda"></div>
    <div class="chip">¡Te invitamos a nuestro cumple!</div>
    <div class="quince">15</div>
    <div class="nombres">JOACO <span>Y</span> BENJA</div><br>
    <div class="cuando">Viernes 13/11 · 17 a 19 hs</div>
  </section>

  <div class="body">
    <div class="bloque">
      <div class="tit">CÓMO LLEGAR</div>
      <div class="lugar">Club Altos Bella Vista</div>
      <div class="dir">Defensa 1050, esq. Chapeaurouge · Bella Vista</div>
      <a class="btn rojo" target="_blank" rel="noopener"
         href="https://www.google.com/maps/search/?api=1&query=Club%20Altos%20Bella%20Vista%2C%20Defensa%201050%2C%20Bella%20Vista%2C%20Buenos%20Aires">📍 Abrir en Google Maps</a>
    </div>

    <div class="bloque">
      <div class="tit">CONFIRMÁ TU ASISTENCIA</div>
      <input id="nombre" autocomplete="name" placeholder="Tu nombre y apellido" maxlength="60">
      <div class="err" id="err"></div>
      <div class="fila">
        <button class="btn rojo" data-va="si">¡SÍ, VOY! ⚽</button>
        <button class="btn borde" data-va="no">No puedo</button>
      </div>
    </div>

    <div class="pie">Al tocar se abre WhatsApp con el mensaje listo para enviar</div>
  </div>
</div>

<script>
const WHATSAPP = "5491132687565";
const input = document.getElementById('nombre');
document.querySelectorAll('[data-va]').forEach(b => b.onclick = () => {
  const n = input.value.trim();
  if (n.length < 3) { document.getElementById('err').textContent = 'Escribí tu nombre y apellido'; input.focus(); return; }
  const t = b.dataset.va === 'si'
    ? `¡Hola! Soy ${n} y confirmo que voy al cumple de 15 de Joaco y Benja (13/11, 17 hs). ⚽`
    : `¡Hola! Soy ${n}. No puedo ir al cumple de Joaco y Benja el 13/11. ¡Que lo disfruten!`;
  window.location.href = `https://wa.me/${WHATSAPP}?text=` + encodeURIComponent(t);
});
input.oninput = () => document.getElementById('err').textContent = '';
</script>
</body>
</html>
